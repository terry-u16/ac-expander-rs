[package]
name = "ac-expander-rs"
version = "0.2.0"
edition = "2024"
description = "A Rust tool to expand and format Rust code files."
authors = ["terry_u16"]

[[bin]]
name = "acxp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"
tempfile = "3.27.0"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
syn = { version = "3.0.9", features = ["full", "visit"] }
